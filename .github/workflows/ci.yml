name: Validate game
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: shift-arena
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: shift-arena/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify production HTTP and four-player WebSockets
        run: npm run smoke:production
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag shift-arena:ci .
